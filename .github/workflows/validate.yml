name: Terraform Validate & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TERRAFORM_VERSION: 1.7
  AWS_REGION: us-east-1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: TFLint
        uses: terraform-linters/setup-tflint@v4
      - run: |
          tflint --init
          tflint --format compact
      #Security Scan
      - name: Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      #Terratest (requires Go tests/terragrunt)
      - name: Setup Go
        uses: actions/setup-go@v5
        if: hashFiles('test/**.go') != ''
        with:
          go-version: '1.21'

      - name: Terratest
        run: |
          if [ -f "go.mod" ]; then
            go mod tidy
            go test -v -timeout 10m ./test/...
          else
            echo "No Terratest found, skipping"
          fi
  plan:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Plan (Staging)
        run: |
          terraform init -backend=false
          terraform plan -var="env=staging" -var="aws_region=us-east-1"
  tag:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get latest tag
        id: latest
        run: |
          LATEST=$(git tag --sort=-v:refname | head -1 || echo "v0.0.0")
          echo "latest=$LATEST" >> $GITHUB_OUTPUT

      - name: Bump patch version
        id: bump
        run: |
          LATEST=${{ steps.latest.outputs.latest }}
          PATCH=$(echo $LATEST | awk -F. '{print $3}')
          MAJOR=$(echo $LATEST | awk -F. '{print $1}')
          MINOR=$(echo $LATEST | awk -F. '{print $2}')
          NEW_TAG="${MAJOR}.${MINOR}.$((PATCH+1))"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Create release tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a ${{ steps.bump.outputs.new_tag }} -m "Release ${{ steps.bump.outputs.new_tag }}"
          git push origin ${{ steps.bump.outputs.new_tag }}